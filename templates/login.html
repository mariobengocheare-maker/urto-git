<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URTO — Sign In</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/urto_icon_180.png">
<style>
  :root {
    color-scheme: dark;
    --navy: #0e1830;
    --gold: #c9a227;
    --gold-bright: #d4af37;
    --bg: #0c1220;
    --card-bg: #131c2e;
    --text: #e7e9ee;
    --text-secondary: #97a2b8;
    --border: #263349;
    --danger-bg: rgba(255, 99, 99, .16);
    --danger-fg: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #16233c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(145deg, var(--gold-bright), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #1c1503; font-size: 1.1rem;
  }
  .brand h1 { font-size: 1.15rem; margin: 0; letter-spacing: .04em; }
  .brand p { margin: 0; font-size: .72rem; color: var(--text-secondary); letter-spacing: .08em; text-transform: uppercase; }
  label { display: block; font-size: .82rem; color: var(--text-secondary); margin: 14px 0 6px; }
  input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(145deg, var(--gold-bright), var(--gold));
    color: #1c1503;
    font-weight: 700;
    font-size: .95rem;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  .error {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--danger-bg);
    color: var(--danger-fg);
    font-size: .85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">U</div>
      <div>
        <h1>URTO</h1>
        <p>Ultimate Realtor Tool</p>
      </div>
    </div>
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>
